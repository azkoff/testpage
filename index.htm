<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  
  <!-- 1. Instant 0-second meta refresh for browsers and search engines -->
  <meta http-equiv="refresh" content="0; url=https://example.com">
  
  <!-- 2. Canonical link to signal the definitive URL to Google for SEO -->
  <link rel="canonical" href="https://example.com">
</head>
<body>
  <h1>Moving to a new page...</h1>
  <p>If you are not redirected automatically, please follow this <a href="https://example.com">link to the new page</a>.</p>
</body>
</html>
